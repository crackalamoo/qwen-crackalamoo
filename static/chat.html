<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3-8B</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100dvh; display: flex; flex-direction: column; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .message { max-width: 720px; width: fit-content; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { background: #2f6fef; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .assistant { background: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; }
  .assistant.streaming::after { content: "▋"; animation: blink 0.7s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #input-row { display: flex; gap: 8px; padding: 16px 24px; border-top: 1px solid #2a2a2a; background: #1a1a1a; }
  #input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #e0e0e0; font-size: 15px; resize: none; height: 48px; max-height: 160px; overflow-y: auto; font-family: inherit; }
  #input:focus { outline: none; border-color: #2f6fef; }
  #send { padding: 0 20px; background: #2f6fef; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; height: 48px; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send:hover:not(:disabled) { background: #4080ff; }
</style>
</head>
<body>
<div id="messages"></div>
<div id="input-row">
  <textarea id="input" placeholder="Message Qwen3-8B..." rows="1"></textarea>
  <button id="send">Send</button>
</div>
<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const history = [];

  function addMessage(role, content = '') {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = '48px';
    sendBtn.disabled = true;

    history.push({ role: 'user', content: text });
    addMessage('user', text);

    const bubble = addMessage('assistant');
    bubble.classList.add('streaming');
    let reply = '';

    try {
      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, stream: true }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const chunk = JSON.parse(data);
            const token = chunk.choices?.[0]?.delta?.content;
            if (token) { reply += token; bubble.textContent = reply; messagesEl.scrollTop = messagesEl.scrollHeight; }
          } catch {}
        }
      }
    } catch (e) {
      bubble.textContent = 'Error: ' + e.message;
    }

    bubble.classList.remove('streaming');
    history.push({ role: 'assistant', content: reply });
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = '48px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
</script>
</body>
</html>
